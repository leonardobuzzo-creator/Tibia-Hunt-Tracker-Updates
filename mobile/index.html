<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hunt Tracker">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<title>Tibia Hunt Tracker Mobile</title>
</head>
<body>
<main class="wrap">
<header class="brand"><div class="crest">⚔</div><div><h1>Tibia Hunt Tracker</h1><p>Mobile Light • somente leitura</p></div></header>

<section id="login">
  <div class="card">
    <label>E-mail</label><input id="email" type="email" autocomplete="email">
    <label>Senha</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn" class="primary">Entrar</button>
    <div id="loginStatus" class="status"></div>
  </div>
</section>

<section id="app" class="hidden">
  <div class="card topbar">
    <div class="grow"><label>Personagem</label><select id="character"></select></div>
    <button id="logout">Sair</button>
  </div>

  <section id="p-home"><div id="kpis" class="grid"></div><div class="card"><h2>Melhores hunts</h2><div id="topHunts"></div></div></section>
  <section id="p-hunts" class="hidden"><div id="hunts"></div></section>
  <section id="p-sessions" class="hidden"><div id="sessions"></div></section>
  <section id="p-more" class="hidden"><div class="card"><h2>Versão mobile</h2><p>Consulta somente leitura dos dados do mesmo Supabase do aplicativo desktop.</p><button id="refresh" class="primary">Atualizar dados</button><div id="syncStatus" class="status"></div></div></section>
</section>
</main>

<nav id="tabs" class="tabs hidden">
<button data-page="home" class="active">◈<span>Resumo</span></button>
<button data-page="hunts">♜<span>Hunts</span></button>
<button data-page="sessions">▤<span>Sessões</span></button>
<button data-page="more">●<span>Mais</span></button>
</nav>

<div id="sheet" class="sheet hidden"><div class="sheetbox"><div class="sheethead"><div><small>Detalhes da sessão</small><h2 id="sheetTitle"></h2></div><button id="closeSheet">Fechar</button></div><div id="sheetBody"></div></div></div>

<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
